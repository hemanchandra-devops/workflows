name: non-prodnodejspipeline
on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      component:
        required: true
        type: string
      version:
        required: true
        type: string 
      environment:
        required: true
        type: string
env:
  ACCID: "634758830486"
jobs:
  non-prodnodejspipeline:
    runs-on: self-hosted
    steps:
      - name: Set App Version
        run: |
          APPVERSION="${{ inputs.version }}"
          APPVERSION="${APPVERSION::7}"
          echo "APPVERSION=$APPVERSION" >> "$GITHUB_ENV"
          echo "App Version: $APPVERSION"
      
      - name: Check Required Checks
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          CHECKS=(
            "DEV DEPLOY"
            "Build Image"
            "Dependabot Alerts"
            "NPM Install"
            "Push Image"
            "Trivy Scan"
            "Unit Test"
          )

          API_URL="https://api.github.com/repos/${{ github.repository }}/commits/${{ inputs.version }}/check-runs"

          RESPONSE=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL")

          for CHECK in "${CHECKS[@]}"; do
            echo "Checking: $CHECK"

            STATUS=$(echo "$RESPONSE" | jq -r \
              --arg CHECK "$CHECK" \
              '[.check_runs[] | select(.name == $CHECK) | .conclusion] | last // empty')

            if [ -z "$STATUS" ]; then
              echo "❌ $CHECK not found"
              exit 1
            fi

            if [ "$STATUS" != "success" ]; then
              echo "❌ $CHECK failed. Status: $STATUS"
              exit 1
            fi

            echo "✅ $CHECK passed"
          done

          echo "✅ All required checks passed."
