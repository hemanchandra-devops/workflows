name: non-prodnodejspipeline
on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      component:
        required: true
        type: string
      version:
        required: true
        type: string 
      environment:
        required: true
        type: string
env:
  ACCID: "634758830486"
jobs:
  non-prodnodejspipeline:
    runs-on: self-hosted
    steps:
      - name: Set App Version
        run: |
          APPVERSION="${{ inputs.version }}"
          APPVERSION="${APPVERSION::7}"
          echo "APPVERSION=$APPVERSION" >> "$GITHUB_ENV"
          echo "App Version: $APPVERSION"
      
      - name: Check Required Checks
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          CHECKS=(
            "Dependabot Alerts"
            "NPM Install"
            "Push Image"
            "Trivy Scan"
            "Unit Test"
            "Build Image"
          )

          SHA="${{ inputs.version }}"
          API_BASE="https://api.github.com/repos/${{ github.repository }}"

          echo "Checking commit: $SHA"

          CHECK_RUNS=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_BASE/commits/$SHA/check-runs")

          COMMIT_STATUS=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_BASE/commits/$SHA/status")

          for CHECK in "${CHECKS[@]}"; do
            echo "Checking: $CHECK"

            # Check Runs
            CHECK_CONCLUSION=$(echo "$CHECK_RUNS" | jq -r \
              --arg CHECK "$CHECK" \
              '[.check_runs[] | select(.name == $CHECK) | .conclusion] | last // empty')

            # Commit Statuses
            STATUS_STATE=$(echo "$COMMIT_STATUS" | jq -r \
              --arg CHECK "$CHECK" \
              '[.statuses[] | select(.context == $CHECK) | .state] | last // empty')

            if [ -n "$CHECK_CONCLUSION" ]; then
              echo "Found Check Run: $CHECK -> $CHECK_CONCLUSION"

              if [ "$CHECK_CONCLUSION" != "success" ]; then
                echo "❌ $CHECK failed. Conclusion: $CHECK_CONCLUSION"
                exit 1
              fi

              echo "✅ $CHECK passed"
              continue
            fi

            if [ -n "$STATUS_STATE" ]; then
              echo "Found Commit Status: $CHECK -> $STATUS_STATE"

              if [ "$STATUS_STATE" != "success" ]; then
                echo "❌ $CHECK failed. State: $STATUS_STATE"
                exit 1
              fi

              echo "✅ $CHECK passed"
              continue
            fi

            echo "❌ $CHECK not found"
            exit 1
          done

          echo "✅ All required checks passed"

